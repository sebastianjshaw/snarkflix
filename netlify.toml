# Run `npm run build` before deploy so review/*.html, feed.xml, and sitemaps exist.
#
# All headers live in this file (no /_headers). Netlify’s _headers parser can mis-merge
# path rules; we previously saw wrong Content-Type on / and “invalid header rule” errors.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/atom+xml; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/image-sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Removed catalog entries (must be before /review/:id rewrite). Old HTML sent Googlebot to netlify.app.
[[redirects]]
  from = "/review/26"
  to = "/"
  status = 301
[[redirects]]
  from = "/review/26.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/review/40"
  to = "/"
  status = 301
[[redirects]]
  from = "/review/40.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/review/41"
  to = "/"
  status = 301
[[redirects]]
  from = "/review/41.html"
  to = "/"
  status = 301

# Legacy ?review= (and /index.html?review=) — consolidate on /review/:id for one canonical URL per review.
[[redirects]]
  from = "/"
  to = "/review/:review"
  status = 301
  force = true
  query = {review = ":review"}
[[redirects]]
  from = "/index.html"
  to = "/review/:review"
  status = 301
  force = true
  query = {review = ":review"}

# Serve crawlable static review HTML at /review/:id → review/:id.html
[[redirects]]
  from = "/review/:id"
  to = "/review/:id.html"
  status = 200
  force = false

# SPA fallback (static files such as /styles.css still win when present)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
