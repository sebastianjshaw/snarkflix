# Run `npm run build` before deploy so review/*.html, feed.xml, and sitemaps exist.
#
# Path-specific Content-Type belongs here — not in _headers next to `/*`.
# Netlify was merging those Content-Type lines onto every response (including /),
# which broke HTML rendering (browser treated homepage as text/plain).

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/atom+xml; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/image-sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Serve crawlable static review HTML at /review/:id → review/:id.html
[[redirects]]
  from = "/review/:id"
  to = "/review/:id.html"
  status = 200
  force = false

# SPA fallback (static files such as /styles.css still win when present)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
