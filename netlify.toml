# Run `npm run build` before deploy so review/*.html, feed.xml, and sitemaps exist.
#
# All headers live in this file (no /_headers). Netlify’s _headers parser can mis-merge
# path rules; we previously saw wrong Content-Type on / and “invalid header rule” errors.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/atom+xml; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/image-sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Serve crawlable static review HTML at /review/:id → review/:id.html
[[redirects]]
  from = "/review/:id"
  to = "/review/:id.html"
  status = 200
  force = false

# SPA fallback (static files such as /styles.css still win when present)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
